<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Melelo Brands — Streetwear</title>
    <meta name="description" content="Melelo Brands — contemporary streetwear. Chaotic authenticity." />

    <!-- Warm up cross-origin connections before CSS/JS ask for them -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://altgclsxeslluxcqybnq.supabase.co" />

    <!-- The two images the storefront's first paint needs, fetched at top
         priority. Added via script so /admin (which never shows them) doesn't
         preload them — avoids wasted bandwidth + console warnings there. -->
    <script>
      if (!location.pathname.startsWith('/admin')) {
        for (const href of ['/bg.webp', '/models/hero_model.webp']) {
          const l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = href; l.fetchPriority = 'high';
          document.head.appendChild(l);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
