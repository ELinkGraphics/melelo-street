<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Melelo Brands — Streetwear</title>
    <meta name="description" content="Melelo Brands — contemporary streetwear. Chaotic authenticity." />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="theme-color" content="#09090b" />

    <!-- Social sharing cards (Instagram, Telegram, Twitter/X, WhatsApp).
         Scrapers need ABSOLUTE URLs — these point at the production domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://melelo.shop/" />
    <meta property="og:site_name" content="Melelo Brands" />
    <meta property="og:title" content="Melelo Brands — Streetwear" />
    <meta property="og:description" content="Contemporary streetwear. Chaotic authenticity. Shop the collection." />
    <meta property="og:image" content="https://melelo.shop/models/hero_model.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Melelo Brands — Streetwear" />
    <meta name="twitter:description" content="Contemporary streetwear. Chaotic authenticity. Shop the collection." />
    <meta name="twitter:image" content="https://melelo.shop/models/hero_model.webp" />

    <!-- Warm up cross-origin connections before CSS/JS ask for them -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://altgclsxeslluxcqybnq.supabase.co" />

    <!-- The two images the storefront's first paint needs, fetched at top
         priority. Added via script so /admin and receipt pages (which never
         show them) don't preload them. When the admin has published a custom
         hero, its URL is cached in localStorage (mlb_hero_v1) — preload THAT
         instead of the bundled default so the correct image races the app. -->
    <script>
      if (!location.pathname.startsWith('/admin') && !location.search.includes('receipt=')) {
        let hero = '/models/hero_model.webp';
        try {
          const h = JSON.parse(localStorage.getItem('mlb_hero_v1') || 'null');
          if (h && typeof h.image === 'string' && h.image.startsWith('http')) hero = h.image;
        } catch (e) { /* private mode */ }
        for (const href of ['/bg.webp', hero]) {
          const l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = href; l.fetchPriority = 'high';
          document.head.appendChild(l);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
